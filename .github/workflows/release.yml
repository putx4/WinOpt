name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "WinOpt v__VERSION__"
          releaseBody: |
            Instaladores generados automáticamente por GitHub Actions.

            - `WinOpt_v__VERSION___x64-setup.exe` — instalador NSIS (recomendado)
            - `WinOpt_v__VERSION___x64_en-US.msi` — paquete MSI
          releaseDraft: true
          prerelease: false