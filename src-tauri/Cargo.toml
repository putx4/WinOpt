[package]
name = "winopt"
version = "0.1.0"
description = "WinOpt - Safe and reversible Windows 11 optimizer (Tauri + Rust + PowerShell engine)"
authors = ["Luis Solano"]
keywords = ["windows", "optimizer", "tauri", "rust", "powershell"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
edition = "2021"

[lib]
name = "winopt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
